name: "💻 Generar Ejecutable WoW Match-3"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-pc:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🤖 Instalar Godot y Compilar
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_executable_download_url: https://tuxfamily.org
          godot_export_templates_download_url: https://tuxfamily.org
          relative_project_path: ./
          archive_output: true

      - name: 📦 Guardar Juego Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Warcraft_Match3_PC
          path: /home/runner/.local/share/godot/builds/
