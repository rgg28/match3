name: "💻 Generar Ejecutable WoW Match-3"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-pc:
    name: 🛠️ Descargar Motor Oficial y Compilar
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código de tu repositorio
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      # 2. Descargar Godot Engine y plantillas de exportación
      - name: 🤖 Instalar Godot Engine (Versión Oficial Standard)
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable/
          
          # Descargar y descomprimir el motor de Linux oficial usando tu enlace directo
          echo "📥 Descargando Godot Engine..."
          curl -L -o godot.zip "https://downloads.godotengine.org/?version=4.2.1&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          mv Godot_v4.2.1-stable_linux.x86_64 godot-engine
          chmod +x godot-engine
          
          # Descargar las plantillas de exportación oficiales para generar el .EXE de Windows
          echo "📥 Descargando plantillas de exportación para Windows..."
          curl -L -o templates.tpz https://github.com
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.1.stable/
          
          # Limpiar archivos comprimidos para liberar espacio
          rm godot.zip templates.tpz

      # 3. Compilar el juego usando la consola interna de Godot
      - name: ⚙️ Compilar a Windows Desktop (.EXE)
        run: |
          mkdir -p builds
          ./godot-engine --headless --export-release "Windows Desktop" builds/WarcraftMatch3.exe

      # 4. Guardar el archivo final .exe para que lo descargues
      - name: 📦 Guardar Juego Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Warcraft_Match3_PC
          path: builds/
