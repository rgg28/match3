name: "💻 Generar Ejecutable WoW Match-3"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-pc:
    name: 🛠️ Compilar Ejecutables de PC
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código de tu repositorio
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      # 2. Compilar usando la acción oficial y estable de GitHub
      - name: 🤖 Instalar Godot y Compilar para PC
        uses: chickenandpork/godot-export@v1
        with:
          godot-version: '4.2.1'
          relative-project-path: './'
          # Esto le dice que use la configuración que pusimos en export_presets.cfg
          export-preset: 'Windows Desktop' 

      # 3. Guardar el archivo .exe listo para descargar
      - name: 📦 Guardar Juego Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Warcraft_Match3_PC
          path: builds/
